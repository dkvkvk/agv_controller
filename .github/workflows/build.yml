name: Build AGV Controller APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project scaffold
        run: flutter create --project-name agv_controller --org com.warehouse --platforms android .

      - name: Configure Android for Bluetooth
        run: |
          python3 << 'PYEOF'
          import os, re

          # ── 1. Patch AndroidManifest.xml — add Bluetooth & Location permissions ──
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()

          permissions = '''    <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''

          if 'BLUETOOTH' not in content:
              content = content.replace('    <application', permissions + '    <application', 1)
              with open(manifest_path, 'w') as f:
                  f.write(content)
              print(f'✅ Patched {manifest_path}')
          else:
              print(f'ℹ️  {manifest_path} already has BT permissions')

          # ── 2. Patch build.gradle — set minSdkVersion to 21 ──
          for name in ['build.gradle', 'build.gradle.kts']:
              path = os.path.join('android', 'app', name)
              if os.path.exists(path):
                  with open(path, 'r') as f:
                      text = f.read()
                  text = text.replace('flutter.minSdkVersion', '21')
                  with open(path, 'w') as f:
                      f.write(text)
                  print(f'✅ Patched {path} — minSdkVersion = 21')

          print('🎉 Android configuration complete!')
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Third-Party Dependencies and Compatibility
        run: |
          python3 << 'PYEOF'
          import os, glob, re

          # ── 1. Patch gradle.properties ──
          properties_path = 'android/gradle.properties'
          if os.path.exists(properties_path):
              with open(properties_path, 'r') as f:
                  props = f.read()

              new_props = props
              if 'android.newDsl' not in props:
                  new_props += '\nandroid.newDsl=false\n'
              if 'android.builtInKotlin' not in props:
                  new_props += 'android.builtInKotlin=false\n'

              if new_props != props:
                  with open(properties_path, 'w') as f:
                      f.write(new_props)
                  print(f"✅ Patched {properties_path}: disabled newDsl and builtInKotlin")
          else:
              print(f"⚠️ {properties_path} not found")

          # ── 2. Bump compileSdk / targetSdk in the app's own build.gradle(.kts) ──
          for name in ['build.gradle', 'build.gradle.kts']:
              app_gradle = os.path.join('android', 'app', name)
              if os.path.exists(app_gradle):
                  with open(app_gradle, 'r') as f:
                      text = f.read()
                  original = text
                  # compileSdk / compileSdkVersion → 36
                  text = re.sub(r'compileSdk\w*\s*[=:]\s*\d+', lambda m: re.sub(r'\d+', '36', m.group()), text)
                  text = re.sub(r"flutter\.compileSdkVersion", "36", text)
                  # targetSdk / targetSdkVersion → 36
                  text = re.sub(r'targetSdk\w*\s*[=:]\s*\d+', lambda m: re.sub(r'\d+', '36', m.group()), text)
                  text = re.sub(r"flutter\.targetSdkVersion", "36", text)
                  if text != original:
                      with open(app_gradle, 'w') as f:
                          f.write(text)
                      print(f"✅ Patched {app_gradle} — compileSdk=36, targetSdk=36")

          # ── 3. Patch flutter_bluetooth_serial in the pub cache ──
          home_dir = os.path.expanduser('~')
          search_pattern = os.path.join(home_dir, '.pub-cache', 'hosted', '**', 'flutter_bluetooth_serial-*', 'android', 'build.gradle')
          cache_files = glob.glob(search_pattern, recursive=True)

          if not cache_files:
              print("⚠️ flutter_bluetooth_serial not found in pub cache. Searching all of .pub-cache...")
              search_pattern_fallback = os.path.join(home_dir, '.pub-cache', '**', 'flutter_bluetooth_serial-*', 'android', 'build.gradle')
              cache_files = glob.glob(search_pattern_fallback, recursive=True)

          if not cache_files:
              print("❌ Could not find flutter_bluetooth_serial in pub cache!")
          else:
              for path in cache_files:
                  print(f"🔍 Found plugin build.gradle: {path}")
                  with open(path, 'r') as f:
                      text = f.read()

                  modified = False

                  # Replace jcenter() with mavenCentral()
                  if 'jcenter()' in text:
                      text = text.replace('jcenter()', 'mavenCentral()')
                      print("   ✅ Replaced jcenter() with mavenCentral()")
                      modified = True

                  # Bump compileSdkVersion → 36
                  new_text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
                  if new_text != text:
                      text = new_text
                      print("   ✅ Bumped compileSdkVersion to 36")
                      modified = True

                  # Also bump targetSdkVersion if present
                  new_text = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', text)
                  if new_text != text:
                      text = new_text
                      print("   ✅ Bumped targetSdkVersion to 36")
                      modified = True

                  # Ensure namespace is declared
                  if 'namespace' not in text and 'android {' in text:
                      text = text.replace('android {', 'android {\n    namespace "io.github.edufolly.flutterbluetoothserial"', 1)
                      print("   ✅ Added missing namespace")
                      modified = True

                  if modified:
                      with open(path, 'w') as f:
                          f.write(text)
                      print(f"   🎉 Successfully patched {path}")
                  else:
                      print("   ℹ️ No patches needed")

          print("🎉 Compatibility patching complete!")
          PYEOF

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGV-Controller-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

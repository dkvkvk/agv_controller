name: Build AGV Controller APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project scaffold
        working-directory: ./agv_controller
        run: flutter create --project-name agv_controller --org com.warehouse --platforms android .

      - name: Configure Android for Bluetooth
        working-directory: ./agv_controller
        run: |
          python3 << 'PYEOF'
          import os, re

          # ── 1. Patch AndroidManifest.xml — add Bluetooth & Location permissions ──
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()

          permissions = '''    <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''

          if 'BLUETOOTH' not in content:
              content = content.replace('    <application', permissions + '    <application', 1)
              with open(manifest_path, 'w') as f:
                  f.write(content)
              print(f'✅ Patched {manifest_path}')
          else:
              print(f'ℹ️  {manifest_path} already has BT permissions')

          # ── 2. Patch build.gradle — set minSdkVersion to 21 ──
          for name in ['build.gradle', 'build.gradle.kts']:
              path = os.path.join('android', 'app', name)
              if os.path.exists(path):
                  with open(path, 'r') as f:
                      text = f.read()
                  text = text.replace('flutter.minSdkVersion', '21')
                  with open(path, 'w') as f:
                      f.write(text)
                  print(f'✅ Patched {path} — minSdkVersion = 21')

          print('🎉 Android configuration complete!')
          PYEOF

      - name: Install dependencies
        working-directory: ./agv_controller
        run: flutter pub get

      - name: Analyze code
        working-directory: ./agv_controller
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        working-directory: ./agv_controller
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGV-Controller-APK
          path: agv_controller/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
